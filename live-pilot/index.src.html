<style>
:root{
  --paper:#EEF0F2;
  --sheet:#FFFFFF;
  --ink:#141726;
  --ink-2:#4A5063;
  --rule:#C9CDD8;
  --carbon:#2A3990;
  --carbon-ink:#FFFFFF;
  --carbon-soft:#E4E8FA;
  --yellow:#FFF0A6;
  --yellow-edge:#D9BC2E;
  --pink:#FFD6E0;
  --pink-edge:#D9738F;
  --done:#E3E6EA;
  --danger:#A3211A;
  --danger-soft:#FBE3E0;
  --focus:#2A3990;
  --sans:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Atkinson Hyperlegible Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#10121B;--sheet:#1A1D2A;--ink:#EEEFF5;--ink-2:#A9AEC2;--rule:#353A4E;
    --carbon:#9FAEFF;--carbon-ink:#10121B;--carbon-soft:#232A4F;
    --yellow:#3B3514;--yellow-edge:#B89C22;--pink:#43202B;--pink-edge:#C8607D;--done:#232633;
    --danger:#FF8A7E;--danger-soft:#3A1614;--focus:#9FAEFF;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#10121B;--sheet:#1A1D2A;--ink:#EEEFF5;--ink-2:#A9AEC2;--rule:#353A4E;
  --carbon:#9FAEFF;--carbon-ink:#10121B;--carbon-soft:#232A4F;
  --yellow:#3B3514;--yellow-edge:#B89C22;--pink:#43202B;--pink-edge:#C8607D;--done:#232633;
  --danger:#FF8A7E;--danger-soft:#3A1614;--focus:#9FAEFF;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.45;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:560px;margin:0 auto}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.eq{align-items:stretch}
.row.eq .btn{flex:1 1 9em}

/* top bar */
.bar{display:flex;justify-content:space-between;align-items:center;padding-block:18px 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);z-index:5}
.mark{font-weight:800;font-size:26px;letter-spacing:-0.02em;background:none;border:0;padding:0;color:var(--ink)}
.mark b{color:var(--carbon)}
.link{background:none;border:0;padding:8px 0;min-height:44px;color:var(--carbon);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* type */
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.h1{font-size:34px;font-weight:800;letter-spacing:-0.02em}
.h2{font-size:24px;font-weight:800;letter-spacing:-0.01em}
.h3{font-size:19px;font-weight:600}
.lede{font-size:18px;color:var(--ink-2);max-width:34em}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:12px 20px;border-radius:6px;border:2px solid var(--ink);background:var(--sheet);font-weight:600;text-align:center}
.btn.primary{background:var(--carbon);border-color:var(--carbon);color:var(--carbon-ink)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
:root[data-theme="dark"] .btn.danger{color:#1a0b0a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.danger{color:#1a0b0a}}
.btn.block{width:100%}
a.btn{text-decoration:none;color:inherit}
a.btn.primary{color:var(--carbon-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* start choices */
.start{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;width:100%;text-align:left;background:var(--sheet);border:2px solid var(--ink);border-radius:6px;padding:18px 18px}
.start .h3{grid-column:1}
.start .sub{grid-column:1;color:var(--ink-2);font-size:16px}
.start .go{grid-column:2;grid-row:1/3;font-size:26px;color:var(--carbon);font-weight:800}

/* slips: the list rows, coloured like the copies of a job sheet */
.group{display:flex;flex-direction:column;gap:10px}
.group-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:6px}
.slip{display:block;width:100%;text-align:left;background:var(--sheet);border:1.5px solid var(--rule);border-radius:4px;padding:0;color:var(--ink)}
.slip.yellow{background:var(--yellow);border-color:var(--yellow-edge)}
.slip.pink{background:var(--pink);border-color:var(--pink-edge)}
.slip.grey{background:var(--done);border-color:var(--rule)}
.slip-main{padding:14px 16px 12px;display:flex;flex-direction:column;gap:2px}
.slip-kind{font-size:14px;color:var(--ink-2)}
.slip-title{font-size:20px;font-weight:600;line-height:1.25}
.slip-stub{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:9px 16px 11px;border-top:1.5px dashed currentColor;font-size:15px}
.slip.yellow .slip-stub{border-top-color:var(--yellow-edge)}
.slip.pink .slip-stub{border-top-color:var(--pink-edge)}
.slip:not(.yellow):not(.pink) .slip-stub{border-top-color:var(--rule)}
.flag{font-weight:600}
.example{opacity:.9;pointer-events:none;position:relative}
.example-tag{position:absolute;top:-10px;right:12px;background:var(--ink);color:var(--paper);font-size:12px;font-weight:600;letter-spacing:.1em;padding:2px 8px;border-radius:3px}

/* sheet */
.sheet{background:var(--sheet);border:1.5px solid var(--rule);border-radius:6px;padding:20px}
.sheet.tight{padding:16px}
.kv{display:grid;grid-template-columns:8.5em 1fr;gap:6px 12px;font-size:17px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0}
@media (max-width:420px){.kv{grid-template-columns:1fr}.kv dd{margin-bottom:6px}}

/* fields */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600}
label.f .hint{font-weight:400;font-size:16px;color:var(--ink-2)}
input[type=text],input[type=date],input[type=time],textarea{width:100%;min-height:52px;padding:12px 14px;border:2px solid var(--ink-2);border-radius:6px;background:var(--sheet);font-size:18px}
textarea{min-height:96px;resize:vertical;line-height:1.4}
input:focus,textarea:focus{border-color:var(--carbon);outline:none;box-shadow:0 0 0 3px var(--carbon-soft)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:10px 16px;border-radius:999px;border:2px solid var(--ink-2);background:var(--sheet);font-size:17px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}
.err{color:var(--danger);font-weight:600}

/* panels */
.safety{background:var(--danger-soft);border:2px solid var(--danger);border-radius:6px;padding:18px;color:var(--ink)}
.safety .h2,.safety .h3{color:var(--danger)}
.check{border:2px solid var(--carbon);border-radius:6px;padding:16px 18px;background:var(--carbon-soft)}
.check .tag{display:inline-block;background:var(--carbon);color:var(--carbon-ink);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:3px;margin-bottom:8px}
.note{border-left:0;background:var(--paper);border-radius:6px;padding:14px 16px;font-size:17px}
.escape{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:2px solid var(--danger);border-radius:6px;padding:10px 14px;color:var(--danger);font-weight:600;background:transparent;width:100%;text-align:left;min-height:52px}

/* steps */
.steps{display:flex;gap:6px}
.steps span{flex:1;height:6px;border-radius:3px;background:var(--rule)}
.steps span.on{background:var(--carbon)}

/* promise slip on task */
.promise{border-radius:6px;border:2px solid var(--yellow-edge);background:var(--yellow);overflow:hidden}
.promise.pink{border-color:var(--pink-edge);background:var(--pink)}
.promise-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px 10px}
.promise-body{padding:0 18px 16px;display:flex;flex-direction:column;gap:6px}
.promise-foot{padding:14px 18px 18px;border-top:2px dashed var(--yellow-edge);display:flex;flex-direction:column;gap:10px}
.promise.pink .promise-foot{border-top-color:var(--pink-edge)}
.promise.white{border-color:var(--ink);background:var(--sheet)}
.promise.white .promise-foot{border-top-color:var(--rule)}
.ref{font-family:var(--mono);font-weight:600;font-size:17px;border:2px solid currentColor;border-radius:4px;padding:3px 8px;white-space:nowrap}
.missed{border:1.5px solid var(--rule);border-radius:6px;padding:12px 14px;font-size:16px;color:var(--ink-2)}
.missed s{color:var(--ink)}

/* thread */
.thread{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.thread li{display:grid;grid-template-columns:5.2em 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--rule);font-size:16px}
.thread li:first-child{border-top:0}
.thread time{font-family:var(--mono);font-size:14px;color:var(--ink-2);padding-top:2px}

/* hold-up card */
.hold{background:var(--ink);color:var(--paper);border-radius:8px;padding:24px 20px;display:flex;flex-direction:column;gap:14px}
.hold .eyebrow{color:var(--paper);opacity:.75}
.hold .who{font-size:38px;font-weight:800;line-height:1.05;letter-spacing:-0.02em}
.hold .big{font-size:22px}
.hold .refbig{font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:.04em}

.copybox{width:100%;min-height:150px;font-family:var(--mono);font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:6px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.shared-banner{background:var(--carbon);color:var(--carbon-ink);border-radius:6px;padding:14px 16px;font-size:17px}
hr.cut{border:0;border-top:2px dashed var(--rule);margin:4px 0}
/* public hero */
.hero{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.hero .h1{font-size:clamp(34px,9vw,46px);line-height:1.02;letter-spacing:-0.03em}
.hero .h1 em{font-style:normal;color:var(--carbon)}
.hero-art{display:block;width:100%;max-width:420px;height:auto;margin:4px auto 0}
.hero-art .k{fill:var(--ink)}.hero-art .s{fill:var(--sheet)}.hero-art .o{stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.hero-art .l{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .18s ease-out}@keyframes fade{from{transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

</head>

  var w=window_(p);
  if(!w)return "No date given";
  if(p.by)return "By "+fmtDay(w.start);
  if(p.allDay)return fmtDay(w.start)+", any time";
  if(p.dueEnd)return fmtDay(w.start)+", "+fmtTime(w.start)+"–"+fmtTime(w.end);

function phaseTitle(p){
  var ph=phase(p),w=window_(p),n=new Date();
  if(ph==="nodate")return "No date yet";
  if(ph==="check")return p.by?"Has it happened?":"Did it happen?";

function fixStep(t){

/* ---------- helper link card ---------- */
function shareCard(t){
  var f=t.fix||{},p=openPromise(t),c={v:2,s:nowIso(),m:t.mode,t:t.title};
  if(f.item)c.i=f.item;if(f.fault)c.f=f.fault;if(f.detail)c.d=f.detail;
  if(t.call){c.w=t.call.who;c.a=t.call.ask}
  if(t.renew&&t.renew.kind){c.r=rname(t.renew);if(t.renew.expiry)c.e=t.renew.expiry}
  if(p)c.p=[p.said,p.party||"",p.dueAt||null,p.dueEnd||null,p.allDay?1:0,p.ref||"",p.loggedAt||null,p.by?1:0];
  var x=t.promises.filter(function(q){return q.status==="missed"}).map(function(q){return [q.said,q.dueAt||null,q.dueEnd||null,q.allDay?1:0,q.ref||"",q.by?1:0]});
  if(x.length)c.x=x;
  if(t.board==="done")c.o=t.outcome||"Finished";
  return c;
}
function b64u(bytes){var s="";for(var i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}

/* ---------- render & events ---------- */
function render(){
  var v=S.view,html;
  if(v.name==="shared")html=viewShared();
  else if(S.booting)html='<header class="bar"><span class="mark">sorted<b>.</b></span></header><p class="muted" style="margin-top:24px">Opening…</p>';
  else if(!S.user)html=viewSignIn();
  else if(v.name==="new")html=viewNew();
  else if(v.name==="safety")html=viewSafety();
  else if(v.name==="task")html=viewTask();
  else if(v.name==="data")html=viewData();
  else html=viewHome();
  $("#app").innerHTML=html;
}

document.addEventListener("input",function(e){

});

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;
  var a=b.getAttribute("data-a"),d=S.draft,t=S.view.id?task(S.view.id):null;
  switch(a){
    case "home":go({name:"home"});break;
    case "data":go({name:"data"});break;
    case "new":S.view={name:"new",mode:b.getAttribute("data-mode")};S.draft={};render();window.scrollTo(0,0);break;
    case "open":go({name:"task",id:b.getAttribute("data-id"),panel:null});break;
    case "plan":d.baseline=b.getAttribute("data-v");d.err="";render();break;
    case "back-title":d.step="title";d.err="";render();break;
    case "safety-new":S.pendingSafety={title:(d.title||"").trim()};S.view={name:"safety",from:"new",mode:S.view.mode};render();break;
    case "safe-continue":
      if(S.view.from==="task"&&task(S.view.id)){var tt=task(S.view.id);tt.safety=true;tt.fix.step="who";log(tt,"Safety stop shown. Told to switch off only if safe and get qualified help.");save();go({name:"task",id:tt.id,panel:null})}
      else{S.view={name:"new",mode:"fix"};S.draft={step:(S.pendingSafety&&S.pendingSafety.title)?"baseline":"title",title:(S.pendingSafety&&S.pendingSafety.title)||"",baseline:"",safety:true};render()}
      break;
    case "d":d[b.getAttribute("data-k")]=b.getAttribute("data-v");d.err="";render();break;
    case "unsafe":if(t){syncWhat(t);S.view={name:"safety",from:"task",id:t.id};render();window.scrollTo(0,0)}break;
    case "check":if(t){t.fix.checks[b.getAttribute("data-k")]=b.getAttribute("data-v");t._dirty=true;save();render()}break;
    case "checks-done":if(t){
      var fixed=Object.keys(t.fix.checks).some(function(k){return t.fix.checks[k]==="fixed"});
      var tried=triedList(t);if(tried.length)log(t,"Checks: "+tried.join("; ")+".");
      if(fixed){t.fix.step="done";t.fix.decision="fixed";t.board="done";t.outcome="Fixed with a safe check";log(t,"Fixed with a safe check. Done.")}
      else t.fix.step="decide";
      commit();}break;
    case "decide":if(t){var v=b.getAttribute("data-v");t.fix.decision=v;t.fix.step="done";
      if(v==="fixed"){t.board="done";t.outcome="Working again";log(t,"Working again. Done.")}
      else if(v==="replace"){log(t,"Decided to replace it.");S.view.panel="done";S.draft={outcome:"Replacing it"}}
      else{log(t,"Decided: "+{claim:"claim it",repair:"book a repair",report:"report it to "+whoName(t)}[v]+".");S.view.panel="call";S.draft={}}
      save();render();window.scrollTo(0,0);}break;
    case "decide-again":if(t){t.fix.step="decide";t.fix.decision=null;log(t,"Changed the decision.");commit()}break;
    case "panel":S.view.panel=b.getAttribute("data-p")||null;S.view.copyText=null;S.draft={};render();break;
    case "no-promise":if(t){log(t,ch(t.call.via).noneLog.replace("{who}",t.call.who));commit();toast("Logged. Still your move.")}break;
    case "kept":if(t){var p=openPromise(t);p.status="kept";p.closedAt=nowIso();log(t,"They kept it: "+p.said+".");S.view.panel=t.mode==="renew"?"renewed":"done";S.draft={};commit()}break;
    case "missed":if(t){var q=openPromise(t);q.status="missed";q.closedAt=nowIso();log(t,"It didn’t happen: "+q.said+" ("+whenText(q)+(q.ref?", ref "+q.ref:"")+").");t.board="yours";S.view.panel="call";S.draft={};commit();window.scrollTo(0,0)}break;
    case "ask-date":if(t){var pd=openPromise(t);pd.status="replaced";pd.closedAt=nowIso();log(t,"Asked them for a date.");S.view.panel="call";S.draft={ask:"You said: “"+pd.said+"”. Which day will that be, and what time? Please give me a reference too."};commit();window.scrollTo(0,0)}break;
    case "applied":if(t){t.renew.applied=true;log(t,"Applied to renew "+rname(t.renew).toLowerCase()+".");S.view.panel="promise";S.draft={};commit();window.scrollTo(0,0)}break;
    case "save-localref":if(t){var lr=$("#f-localref");localRef(t.id,lr?lr.value.trim():"");toast("Kept on this phone only")}break;
    case "summary":S.view.panel=S.view.panel==="summary"?null:"summary";render();break;
    case "copy-summary":if(t)copy(repairerSummary(t),"Summary copied");break;
    case "share":if(t){
      var fresh=!t.shareToken;
      if(fresh){var rb=new Uint8Array(24);crypto.getRandomValues(rb);t.shareToken=b64u(rb)}
      var url=location.origin+"/?share="+t.shareToken;
      copy(url,"Link copied. Send it to them.");
      if(fresh){log(t,"Shared with a helper.");save();
        sb.from("shares").insert({token:t.shareToken,task_id:t.id,card:shareCard(t)}).then(function(r){if(r.error){toast("Couldn’t create the link. Try again.");delete t.shareToken;t._dirty=true;save();render()}})}
      if(!S.view.copyText)render()}break;
    case "unshare":if(t&&t.shareToken){sb.from("shares").delete().eq("task_id",t.id).then(function(){});delete t.shareToken;log(t,"Stopped sharing. The old link no longer works.");commit();toast("Link switched off")}break;
    case "export":copy(JSON.stringify({exported:nowIso(),tasks:S.tasks},null,2),"All tasks copied");break;
    case "wipe-ask":S.view.confirm=true;render();break;
    case "wipe-cancel":S.view.confirm=false;render();break;
    case "wipe":sb.rpc("delete_my_account").then(function(r){if(r.error){toast("Couldn’t delete. Check your connection.");return}try{localStorage.removeItem(cacheKey());Object.keys(localStorage).forEach(function(k){if(k.indexOf("sorted.local.")===0)localStorage.removeItem(k)})}catch(e){}S.tasks=[];sb.auth.signOut().finally(function(){S.user=null;go({name:"home"});toast("Your account and tasks are deleted")})});break;
    case "signout":sb.auth.signOut().finally(function(){S.user=null;S.tasks=[];go({name:"home"})});break;
    case "consent":S.draft.consent=!S.draft.consent;S.draft.err="";render();break;
    case "privacy":S.draft.showPrivacy=!S.draft.showPrivacy;render();break;
    case "resend":S.draft.sent=false;render();break;
  }
});

function syncWhat(t){
  var d=S.draft,f=t.fix;

  f.item=item||f.item||"";if(d.fault!==undefined)f.fault=d.fault;if(d.detail!==undefined)f.detail=d.detail.trim();

document.addEventListener("submit",function(e){
  e.preventDefault();
  var form=e.target,k=form.getAttribute("data-f"),d=S.draft,t=S.view.id?task(S.view.id):null;
  if(k==="signin"){
    var em=$("#f-email").value.trim();d.email=em;
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){d.err="That email doesn’t look right.";render();return}
    if(!d.consent){d.err="Tick the box to say you’re happy to take part.";render();return}
    d.err="";d.busy=true;render();
    sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:location.origin+"/",data:{pilot_consent_at:nowIso()}}}).then(function(r){
      d.busy=false;
      if(r.error){d.err=/rate|many|seconds/i.test(r.error.message)?"Too many links sent. Wait a few minutes and try again.":"Couldn’t send the link. Check the email and try again.";render();return}
      d.sent=true;render();
    });
    return;
  }
  if(k==="title"){
    d.title=$("#f-title").value;
    if(d.title.trim().length<2){d.err="Give it a short name you’ll recognise.";render();return}
    if(S.view.mode==="fix"&&looksUnsafe(d.title)){S.pendingSafety={title:d.title.trim()};S.view={name:"safety",from:"new",mode:"fix"};render();window.scrollTo(0,0);return}
    d.step="baseline";d.err="";render();return;
  }
  if(k==="baseline"){
    var own=$("#f-baseline").value.trim();if(own)d.baseline=own;
    if(!d.baseline||d.baseline.trim().length<2){d.err="Pick one, or say it in your own words. “Not sure yet” is a fine answer.";render();return}
    newTask(S.view.mode);return;
  }
  if(!t)return;
  if(k==="what"){
    var item=d.item!==undefined?d.item:(t.fix.item||"Washing machine");
    if(item!=="Washing machine"){var iv=$("#f-item");item=iv?iv.value.trim():item}
    var fault=d.fault!==undefined?d.fault:t.fix.fault;
    var detail=$("#f-detail").value.trim();
    if(!item){d.err="Say what it is.";render();return}
    if(item==="Washing machine"&&!fault){d.err="Pick what it’s doing.";render();return}
    if(!t.safety&&looksUnsafe(detail,t.title,item)){t.fix.item=item;t.fix.fault=fault||"other";t.fix.detail=detail;save();S.view={name:"safety",from:"task",id:t.id};render();window.scrollTo(0,0);return}
    t.fix.item=item;t.fix.fault=item==="Washing machine"?fault:"other";t.fix.detail=detail;t.fix.step="who";
    log(t,"Fault: "+item+(item==="Washing machine"?", "+label(FAULTS,fault).toLowerCase():"")+(detail?". "+detail:"")+".");
    S.draft={};commit();return;
  }
  if(k==="who"){
    var r=d.responsible!==undefined?d.responsible:t.fix.responsible;
    if(!r){d.err="Pick one. If you rent, it’s usually your landlord.";render();return}
    t.fix.responsible=r;
    if(r!=="me"){var pv=$("#f-party"),jv=$("#f-jobRef");t.fix.party=pv?pv.value.trim():"";t.fix.jobRef=jv?jv.value.trim():"";t.fix.step="decide";
      log(t,"Someone else fixes it: "+whoName(t)+(t.fix.jobRef?", job "+t.fix.jobRef:"")+".")}
    else{t.fix.step="bought";log(t,"It’s yours, so you decide: claim, repair or replace.")}
    S.draft={};commit();return;
  }
  if(k==="bought"){
    var a=d.age!==undefined?d.age:t.fix.age;
    if(!a){d.err="Pick one. “Not sure” is fine.";render();return}
    t.fix.age=a;t.fix.cover=(d.cover!==undefined?d.cover:t.fix.cover)||"unsure";t.fix.seller=$("#f-seller").value.trim();
    var skipChecks=t.safety||t.fix.item!=="Washing machine"||!(CHECKS[t.fix.fault]||[]).length;
    t.fix.step=skipChecks?"decide":"checks";
    log(t,(agoText(a)?"Bought "+agoText(a):"Not sure when it was bought")+(t.fix.seller?", from "+t.fix.seller:"")+". Warranty or insurance: "+label(COVER,t.fix.cover).toLowerCase()+".");
    S.draft={};commit();return;
  }
  if(k==="call"){
    var who=$("#f-who").value.trim(),ask=$("#f-ask").value.trim(),via=d.via||(t.call&&t.call.via)||"phone";
    if(!who||!ask){d.err="Fill in who, and what to ask for.";render();return}
    var chasing=!!recentMiss(t);
    t.call={who:who,ask:ask,via:via};
    log(t,(chasing?"Follow-up ready: ":ch(via).ready+": ")+who+", by "+label(VIA,via).toLowerCase()+".");
    S.view.panel=null;S.draft={};commit();window.scrollTo(0,0);return;
  }
  if(k==="promise"){
    var rn2=t.mode==="renew"&&t.renew&&t.renew.applied&&!t.call;
    var when=d.when||(rn2?"by":"slot"),val=function(id){var el=$(id);return el?el.value:""};
    var said=$("#f-said").value.trim(),party=$("#f-party2").value.trim(),date=val("#f-date"),from=when==="slot"?val("#f-from"):"",to=when==="slot"?val("#f-to"):"",ref=$("#f-ref").value.trim();
    d.said=said;d.party=party;d.date=date;d.from=from;d.to=to;d.ref=ref;
    if(!said){d.err="Write what they said, in a few words.";render();return}
    if(when!=="none"&&!date){d.err=when==="by"?"Pick the day they said, or choose “They didn’t give a date”.":"Pick the day, or choose “They didn’t give a date”.";render();return}
    var dueAt=null,end=null,allDay=false;
    if(when!=="none"){
      var ymd=date.split("-").map(Number),start=new Date(ymd[0],ymd[1]-1,ymd[2],0,0,0,0);allDay=!from;
      if(from){var hm=from.split(":").map(Number);start.setHours(hm[0],hm[1])}
      if(from&&to){var hm2=to.split(":").map(Number);var e2=new Date(start);e2.setHours(hm2[0],hm2[1]);if(e2>start)end=e2.toISOString()}
      dueAt=start.toISOString();
    }
    var pr={id:uid(),said:said,party:party,dueAt:dueAt,dueEnd:end,allDay:allDay,by:when==="by",ref:ref,status:"open",loggedAt:nowIso()};
    t.promises.push(pr);t.board=pr.dueAt?"waiting":"yours";
    log(t,"They said: "+said+(pr.dueAt?", "+whenText(pr).replace(/^By/,"by"):". No date given")+(ref?", ref "+ref:"")+".");
    S.view.panel=null;S.draft={};commit();window.scrollTo(0,0);return;
  }
  if(k==="rwhat"){
    var kd=d.kind!==undefined?d.kind:t.renew.kind;
    if(!kd){d.err="Pick one. “Something else” is fine.";render();return}
    var vs=d.visa!==undefined?d.visa:t.renew.visa;
    if(kd==="visa"&&!vs){d.err="Pick the visa type. “Another visa” is fine.";render();return}
    var wi=$("#f-rwhat");
    t.renew.kind=kd;t.renew.visa=kd==="visa"?vs:null;t.renew.what=wi?wi.value.trim():"";t.renew.step="when";
    log(t,"Renewing: "+rname(t.renew)+".");S.draft={};commit();return;
  }
  if(k==="rwhen"){
    var unk=d.unknown!==undefined?!!d.unknown:!!t.renew.expiryUnknown,ex=$("#f-expiry");ex=ex?ex.value:"";
    if(!unk&&!ex){d.err="Add the date, or choose “I don’t know the date”.";render();return}
    t.renew.expiry=unk?null:ex;t.renew.expiryUnknown=unk;
    t.renew.step=(t.renew.kind==="insurance"||t.renew.kind==="other")?"who":"done";
    log(t,unk?"End date not known yet.":"Ends "+fmtDay(dayEnd(ex))+". Start by "+fmtDay(startBy(t.renew))+".");
    S.draft={};commit();return;
  }
  if(k==="rwho"){
    var pv2=$("#f-provider").value.trim();
    if(!pv2){d.err="Add who you renew it with. Check your letter or account.";render();return}
    t.renew.provider=pv2;t.renew.via=d.via||"email";t.renew.step="done";
    log(t,"Renews with "+pv2+".");S.draft={};commit();return;
  }
  if(k==="rdate"){
    var ex2=$("#f-expiry2").value;if(!ex2)return;
    t.renew.expiry=ex2;t.renew.expiryUnknown=false;log(t,"Ends "+fmtDay(dayEnd(ex2))+". Start by "+fmtDay(startBy(t.renew))+".");commit();return;
  }
  if(k==="renewed"){
    var ne=$("#f-newexp").value,keep=d.keep===undefined?true:!!d.keep;
    t.board="done";t.outcome="Renewed"+(ne?", now ends "+fmtDay(dayEnd(ne)):"");
    var op=openPromise(t);if(op){op.status="kept";op.closedAt=nowIso()}
    log(t,"Renewed."+(ne?" New end date "+fmtDay(dayEnd(ne))+".":""));
    if(keep&&ne){
      var nt={id:uid(),mode:"renew",title:t.title,baseline:"Carried over from last time",created:nowIso(),updatedAt:nowIso(),board:"yours",safety:false,fix:null,
        renew:{step:"done",kind:t.renew.kind,visa:t.renew.visa,what:t.renew.what,provider:t.renew.provider,via:t.renew.via,expiry:ne},call:null,promises:[],outcome:"",events:[],sharedAt:null};
      log(nt,"Kept for next time. Ends "+fmtDay(dayEnd(ne))+".");S.tasks.unshift(nt);
    }
    S.view.panel=null;S.draft={};commit();toast(keep&&ne?"Done. Sorted will remind you next time.":"Done");return;
  }
  if(k==="done"){
    var out=$("#f-outcome").value.trim();
    if(!out){d.err="A few words is enough.";render();return}
    t.board="done";t.outcome=out;log(t,"Finished: "+out);S.view.panel=null;S.draft={};commit();return;
  }
});

document.addEventListener("visibilitychange",function(){if(!document.hidden&&S.user){var a=document.activeElement;if(!a||!/INPUT|TEXTAREA/.test(a.tagName))render()}});
/* keep time-based states honest while the page stays open */
setInterval(function(){if(S.view.name==="home"||S.view.name==="task"){var a=document.activeElement;if(!a||!/INPUT|TEXTAREA/.test(a.tagName))render()}},60000);

/* ---------- boot ---------- */
function setUser(u){
  var id=u?u.id:null;
  if(S.user&&id===S.user.id){S.booting=false;return}
  S.user=u||null;
  if(!u){S.tasks=[];S.booting=false;render();return}
  S.tasks=cacheRead();S.booting=false;render();
  if(/access_token|error_description/.test(location.hash))try{history.replaceState(null,"",location.pathname)}catch(e){}
  sb.from("tasks").select("data").order("updated_at",{ascending:false}).then(function(r){
    if(r.error){offline(true);return}
    offline(false);
    var dirty=S.tasks.filter(function(t){return t._dirty});
    S.tasks=r.data.map(function(x){return x.data});
    dirty.forEach(function(t){var i=S.tasks.findIndex(function(y){return y.id===t.id});if(i>=0)S.tasks[i]=t;else S.tasks.unshift(t)});
    cacheWrite();save();
    if(S.view.name==="home"||S.view.name==="task")render();
  });
}
function loadShared(token){
  sb.rpc("get_share",{p_token:token}).then(function(r){
    S.sharedLoading=false;
    var row=r.data&&r.data[0];
    S.shared=row?row.card:null;S.sharedAt=row?row.updated_at:null;render();
  });
}
function boot(){
  var token=new URLSearchParams(location.search).get("share");
  if(token){
    S.view={name:"shared"};S.sharedLoading=true;render();
    loadShared(token);
    setInterval(function(){if(!document.hidden)loadShared(token)},30000);
    return;
  }
  render();
  sb.auth.onAuthStateChange(function(ev,session){setUser(session?session.user:null)});
  sb.auth.getSession().then(function(r){setUser(r.data.session?r.data.session.user:null)});
}
boot();
})();
</script>
