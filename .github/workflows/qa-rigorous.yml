name: QA rigorous stress
on:
  push:
    branches: [qa-rigorous-20261002]
  workflow_dispatch:

jobs:
  rigorous:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser runtime
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run complete Sorted suite including rigorous stress
        run: sh tests/run.sh
