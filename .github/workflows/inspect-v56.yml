name: Inspect v56 case detail
on:
  push:
    branches: [case-detail-redesign-v56]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build current branch
        run: node all.js
      - name: Print move model and handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('public/index.html').read_text()
          for marker,before,after in [('function openMove',0,1800),('function moveForm',0,6500),('case "move-done"',1200,3500),('case "move-rebook"',800,2500)]:
            i=s.find(marker)
            print('\n===== ',marker,' ',i,' =====')
            if i>=0: print(s[max(0,i-before):i+after])
          PY
