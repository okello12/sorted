name: Inspect v75

on:
  push:
    branches: [ui-consolidation-v75]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser runtime
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Prepare app
        run: |
          export TZ=Europe/London
          export PYTHONPATH="$PWD/tests"
          node all.js >/dev/null
          (cd tests && npm ci --omit=optional --ignore-scripts --silent)
          mkdir -p tests/out
          sed 's#\(supabase-js@[0-9.]*/dist/umd/supabase.js"\) integrity="[^"]*"#\1#' public/index.html > tests/out/index.html
          node tests/make_reader.js
      - name: Inspect case control renderers
        run: |
          node <<'NODE'
          const fs=require('fs'); const s=fs.readFileSync('public/index.html','utf8');
          for (const q of ['data-p="paste"','case56-sharing','case56Evidence','case75Secondary']) {
            let i=s.indexOf(q); console.log('\n===== '+q+' @ '+i+' =====');
            console.log(i<0?'NOT FOUND':s.slice(Math.max(0,i-900),i+1600));
          }
          NODE
      - name: Run remaining walkthroughs with full tracebacks
        env:
          TZ: Europe/London
          PYTHONPATH: ${{ github.workspace }}/tests
        run: |
          status=0
          for t in 01_basics.py 09_paste_wins.py 18_intake.py 22_case_facts.py 26_response.py 28_case_tools.py 37_ui_consolidation.py; do
            echo "===== $t ====="
            python3 "tests/$t" || status=1
          done
          exit $status
      - name: Show generated fingerprint
        if: always()
        run: sha1sum public/index.html
