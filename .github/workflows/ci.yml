name: Sorted pressure CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sorted-pressure-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser runtime
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Build pressure fixture
        run: |
          export TZ=Europe/London
          node all.js >/dev/null
          [ -d tests/node_modules ] || (cd tests && npm ci --omit=optional --ignore-scripts --silent)
          mkdir -p tests/out
          sed 's#\(supabase-js@[0-9.]*/dist/umd/supabase.js"\) integrity="[^"]*"#\1#' public/index.html > tests/out/index.html
          node tests/make_reader.js
      - name: Run core pressure test with full traceback
        env:
          TZ: Europe/London
          PYTHONPATH: ${{ github.workspace }}/tests
        run: python3 tests/53_pressure_core.py
      - name: Run Moving Home pressure test with full traceback
        if: always()
        env:
          TZ: Europe/London
          PYTHONPATH: ${{ github.workspace }}/tests
        run: python3 tests/54_pressure_moving_home.py
      - name: Verify production build fingerprint remains pinned
        if: always()
        run: |
          node <<'NODE'
          const fs=require('fs'), crypto=require('crypto');
          const all=fs.readFileSync('all.js','utf8');
          const ns=[...all.matchAll(/'build(\d+)\.js'/g)].map(m=>+m[1]);
          if(!ns.length) throw new Error('no numbered build layer found');
          const file='build'+Math.max(...ns)+'.js';
          const src=fs.readFileSync(file,'utf8');
          const m=src.match(/const EXPECT='([0-9a-f]{40})'/);
          if(!m) throw new Error(file+' has no pinned EXPECT fingerprint');
          const actual=crypto.createHash('sha1').update(fs.readFileSync('public/index.html')).digest('hex');
          if(actual!==m[1]) throw new Error('generated '+actual+' != '+file+' EXPECT '+m[1]);
          console.log(file+' pinned '+actual);
          NODE
