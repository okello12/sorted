name: QA v58 cleanup
on:
  push:
    branches: [case-detail-redesign-v58]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary QA scaffolding
        run: |
          git rm -f \
            .github/workflows/inspect-v58.yml \
            .github/workflows/patch-v58-tests.yml \
            .github/workflows/qa-v58-debug.yml \
            .github/workflows/qa-v58-fast.yml \
            .github/workflows/qa-v58.yml \
            QA_V58_FINAL.md
          git config user.name "Sorted QA"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore: remove temporary v58 QA scaffolding"
          git push
