name: Inspect v75

on:
  push:
    branches: [ui-consolidation-v75]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build current app
        run: |
          node all.js
          sha1sum public/index.html
