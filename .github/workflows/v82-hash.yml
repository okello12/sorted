name: v82 fingerprint probe
on:
  push:
    branches: [resolution-flywheel-v82]
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build through v82
        run: node all.js
