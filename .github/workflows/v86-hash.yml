name: v86 fingerprint probe
on:
  push:
    branches: [resolution-flywheel-v82]
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and probe v86
        run: |
          node all.js
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          let s=fs.readFileSync('build86.js','utf8').replace("const EXPECT='0000000000000000000000000000000000000000';","const EXPECT='';");
          fs.writeFileSync('.v86.js',s);cp.execSync('node .v86.js',{stdio:'inherit'});fs.unlinkSync('.v86.js');
          NODE
          sha1sum public/index.html
