name: Sorted regression CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    concurrency:
      group: sorted-regression-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install browser runtime
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run full regression suite
        run: SORTED_JOBS=4 sh tests/run.sh
      - name: Verify final build fingerprint is pinned
        run: |
          node <<'NODE'
          const fs=require('fs'), crypto=require('crypto');
          const all=fs.readFileSync('all.js','utf8');
          const ns=[...all.matchAll(/'build(\d+)\.js'/g)].map(m=>+m[1]);
          if(!ns.length) throw new Error('no numbered build layer found');
          const file='build'+Math.max(...ns)+'.js';
          const src=fs.readFileSync(file,'utf8');
          const m=src.match(/const EXPECT='([0-9a-f]{40})'/);
          if(!m) throw new Error(file+' has no pinned EXPECT fingerprint');
          const actual=crypto.createHash('sha1').update(fs.readFileSync('public/index.html')).digest('hex');
          if(actual!==m[1]) throw new Error('generated '+actual+' != '+file+' EXPECT '+m[1]);
          console.log(file+' pinned '+actual);
          NODE

  engines:
    concurrency:
      group: sorted-engines-${{ matrix.engine }}-${{ github.ref }}
      cancel-in-progress: true
    # The same page in Safari's engine and in Firefox: a short walk (tests/engine_smoke.py) that a Chromium-only suite
    # cannot see break. Not an iPhone: a real phone with VoiceOver is still checked by hand before a wider release.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install browser runtime
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps ${{ matrix.engine }}
      - name: Build the page for tests
        run: |
          node all.js >/dev/null
          mkdir -p tests/out
          sed 's#\(supabase-js@[0-9.]*/dist/umd/supabase.js"\) integrity="[^"]*"#\1#' public/index.html > tests/out/index.html
      - name: Walk through Sorted in ${{ matrix.engine }}
        env:
          SORTED_ENGINE: ${{ matrix.engine }}
          TZ: Europe/London
          PYTHONPATH: ${{ github.workspace }}/tests
        run: |
          out=$(python3 tests/engine_smoke.py 2>&1) || true
          echo "$out"
          echo "$out" | grep -q "FAILS \[\]" && echo "$out" | grep -q "ERRORS \[\]"
      - name: Tap through Home, Cases, More and New in ${{ matrix.engine }} on a touch phone
        env:
          SORTED_ENGINE: ${{ matrix.engine }}
          TZ: Europe/London
          PYTHONPATH: ${{ github.workspace }}/tests
        run: |
          out=$(python3 tests/engine_nav.py 2>&1) || true
          echo "$out"
          echo "$out" | grep -q "FAILS \[\]" && echo "$out" | grep -q "ERRORS \[\]"


  secrets-check:
    # Since v149: fails (red) when the staging secrets are missing, so a required staging check can never pass by being skipped.
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      staging: ${{ steps.s.outputs.staging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: s
        env:
          U: ${{ secrets.SORTED_STAGING_URL }}
          K: ${{ secrets.SORTED_STAGING_ANON_KEY }}
        run: |
          if { [ -n "$U" ] && [ -n "$K" ]; } || [ -f tests/live/staging_target.json ]; then echo "staging=yes" >> "$GITHUB_OUTPUT"; else echo "staging=no" >> "$GITHUB_OUTPUT"; echo "::error title=staging::No staging target: neither the repository secrets nor tests/live/staging_target.json (docs/STAGING.md). Since v149 a missing staging gate fails the build."; exit 1; fi

  staging:
    # The live suite (tests/live/staging.py) against the STAGING Supabase project: row level security, grants, share
    # links, deleting an account, and the real page saving a real case. Never against live. Runs on every pull request
    # (part of the release gate, docs/PLAN.md 0.1), when asked, and after each push to main. Without the repository
    # secrets SORTED_STAGING_URL and SORTED_STAGING_ANON_KEY it is skipped and says so (secrets-check above); it never
    # passes without running. docs/STAGING.md says how to set them.
    needs: secrets-check
    if: needs.secrets-check.outputs.staging == 'yes'
    concurrency:
      group: sorted-staging-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install browser runtime
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Build the page
        run: node all.js >/dev/null
      - name: Run the live suite against staging
        env:
          SORTED_STAGING_URL: ${{ secrets.SORTED_STAGING_URL }}
          SORTED_STAGING_ANON_KEY: ${{ secrets.SORTED_STAGING_ANON_KEY }}
          TZ: Europe/London
        run: python3 tests/live/staging.py

  live:
    # Step 5 of the release gate: after a push to main, wait until Vercel serves exactly the page this commit built,
    # then walk it once against the real backend with a throwaway guest account that deletes itself and proves it
    # (tests/live/verify_live.py). A red "live" means the release is not finished. A later push queues behind this
    # job rather than cancelling it, and the last step always runs, so a guest from a cut-short walk is still deleted.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: sorted-live
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install browser runtime
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Build the page
        run: node all.js >/dev/null
      - name: Check the live site is this build, and walk it
        env:
          TZ: Europe/London
          SORTED_LIVE_SESSION: ${{ runner.temp }}/live-session.json
        run: python3 tests/live/verify_live.py
      - name: Delete the guest account if the walk was cut short
        if: always()
        env:
          SORTED_LIVE_SESSION: ${{ runner.temp }}/live-session.json
        run: python3 tests/live/verify_live.py --cleanup
