name: QA home v54 visual polish
on:
  push:
    branches: [home-visual-polish-v54]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and show fingerprint
        run: node all.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser runtime
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run full walkthrough suite
        run: sh tests/run.sh
      - name: Upload v54 dark preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home54-dark-preview
          path: tests/out/home54-dark.png
          if-no-files-found: ignore
